name: Deploy to Production

# Triggered only by pushing a semver tag (e.g. v1.4.0) — never automatically
# on every merge to main. The `production` environment below should have a
# required reviewer configured in GitHub (Settings → Environments), which
# pauses the run until someone approves it.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: production # gated by required reviewers
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API to production
        run: echo "Deploying apps/api ${{ github.ref_name }} to production..."

  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4
      - name: Deploy web to production
        run: echo "Deploying apps/web ${{ github.ref_name }} to production..."

  submit-mobile-release:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4
      - name: Submit mobile build to app stores
        run: echo "Submitting mobile ${{ github.ref_name }} to App Store / Play Store..."

  release-notes:
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web, submit-mobile-release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog from Conventional Commits
        run: echo "Generating release notes for ${{ github.ref_name }}..."
      # e.g. release-drafter, conventional-changelog-action, or `gh release create`