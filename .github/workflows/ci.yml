name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - name: Calculate live test and coverage metrics
        if: always()
        run: node scripts/summarize-tests.js
      - name: Publish metrics to job summary
        if: always()
        run: |
          node -e "const s=require('./test-results/ci-summary.json'); console.log('## Browser test metrics\n\n| Metric | Result |\n|---|---:|\n| Tests passed | '+s.passed+' / '+s.total+' |\n| Failed | '+s.failed+' |\n| Skipped | '+s.skipped+' |\n| JavaScript function coverage | '+s.coverage+'% |')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
      - name: Update live README badge data
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metrics_dir="$RUNNER_TEMP/ci-metrics"
          rm -rf "$metrics_dir"
          git clone --quiet --depth 1 --branch ci-metrics "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$metrics_dir" || {
            mkdir -p "$metrics_dir"
            cd "$metrics_dir"
            git init -q
            git checkout -q --orphan ci-metrics
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          }
          cp "$GITHUB_WORKSPACE/test-results/ci-tests.json" "$metrics_dir/ci-tests.json"
          cp "$GITHUB_WORKSPACE/test-results/ci-coverage.json" "$metrics_dir/ci-coverage.json"
          cd "$metrics_dir"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-tests.json ci-coverage.json
          git commit -m "chore: update CI metrics" || true
          git push origin HEAD:ci-metrics --force
