# Pre-commit config — runs fast, local checks before a commit is allowed.
# Install: pip install pre-commit  (or: brew install pre-commit)
# Enable in this repo: pre-commit install            # runs on `git commit`
#                       pre-commit install --hook-type commit-msg   # for commit-msg linting below
# Run manually against everything: pre-commit run --all-files
#
# Keep this fast — this runs on every commit. Full lint/type-check/test
# suites belong in CI (.github/workflows/ci.yml), not here.

default_stages: [commit]

repos:
  # ---- General hygiene -------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # ---- Secret scanning ---------------------------------------------------
  # Catches accidentally committed API keys, tokens, credentials.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ---- Formatting (JS/TS/JSON/MD/YAML) -----------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        exclude: ^(package-lock\.json|.*/package-lock\.json)$

  # ---- Linting (uses each app's own local eslint + config) --------------
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx eslint --fix
        language: system
        files: \.(js|jsx|ts|tsx)$
        exclude: ^(node_modules|.*/node_modules)/
        pass_filenames: true

  # ---- Commit message convention (Conventional Commits) ------------------
  # Requires: npm install -D @commitlint/cli @commitlint/config-conventional
  # and a commitlint.config.js at the repo root:
  #   module.exports = { extends: ['@commitlint/config-conventional'] };
  - repo: local
    hooks:
      - id: commitlint
        name: Commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
